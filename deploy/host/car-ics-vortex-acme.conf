# HTTP only — install before issuing car.ics-vortex.com cert (see scripts/issue-car-tls-cert.sh).

server {
    listen 80;
    listen [::]:80;
    server_name car.ics-vortex.com api.car.ics-vortex.com cms.car.ics-vortex.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
