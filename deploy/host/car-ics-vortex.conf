# Host nginx → Car Portal Docker (127.0.0.1:8081)
# TLS: car.ics-vortex.com + api/cms.car (see scripts/sync-host-nginx.sh)

map $http_upgrade $car_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name car.ics-vortex.com api.car.ics-vortex.com cms.car.ics-vortex.com
                carmain.com.ua www.carmain.com.ua api.carmain.com.ua cms.carmain.com.ua;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.car.ics-vortex.com cms.car.ics-vortex.com
                api.carmain.com.ua cms.carmain.com.ua;

    ssl_certificate /etc/letsencrypt/live/api-cms.car.ics-vortex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-cms.car.ics-vortex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $car_connection_upgrade;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name car.ics-vortex.com carmain.com.ua www.carmain.com.ua;

    ssl_certificate /etc/letsencrypt/live/car.ics-vortex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/car.ics-vortex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $car_connection_upgrade;
        proxy_read_timeout 300s;
    }
}
