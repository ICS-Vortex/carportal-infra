# Production (HTTP inside Docker; TLS on host nginx).

server {
  listen 80;
  server_name car.ics-vortex.com carmain.com.ua www.carmain.com.ua;

  location ^~ /v1/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host api.car.ics-vortex.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location ^~ /uploads/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host api.car.ics-vortex.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ~* \.(png|jpe?g|webp|svg|ico)$ {
    root /var/www/frontend-public;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri @frontend;
  }

  location / {
    root /var/www/frontend-public;
    try_files $uri @frontend;
  }

  location @frontend {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 80;
  server_name api.car.ics-vortex.com api.carmain.com.ua;

  client_max_body_size 16m;

  location / {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 80;
  server_name cms.car.ics-vortex.com cms.carmain.com.ua;

  client_max_body_size 16m;

  location / {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cms_upstream cms:8000;
    proxy_pass http://$cms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
