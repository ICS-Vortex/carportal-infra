# HTTP -> HTTPS (local dev TLS). Plain HTTP remains available if certs are missing and
# you use a legacy config; with this file, generate certs via scripts/dev-tls.sh first.

server {
  listen 80;
  server_name
    carmain.local carmain.localhost.com
    api.carmain.local api.carmain.localhost.com
    cms.carmain.local cms.carmain.localhost.com
    pgadmin.carmain.local pgadmin.localhost.com
    rabbitmq.carmain.local rabbitmq.carmain.localhost.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name carmain.local carmain.localhost.com;

  include /etc/nginx/snippets/ssl-dev.conf;

  location ^~ /v1/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host api.carmain.localhost.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location ^~ /uploads/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host api.carmain.localhost.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location ~* \.(png|jpe?g|webp|svg|ico)$ {
    root /var/www/frontend-public;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri @frontend;
  }

  location / {
    root /var/www/frontend-public;
    try_files $uri @frontend;
  }

  location @frontend {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 443 ssl;
  server_name api.carmain.local api.carmain.localhost.com;

  include /etc/nginx/snippets/ssl-dev.conf;

  client_max_body_size 2m;

  location / {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen 443 ssl;
  server_name pgadmin.carmain.local pgadmin.localhost.com;

  include /etc/nginx/snippets/ssl-dev.conf;

  location / {
    proxy_pass http://pgadmin:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  server_name cms.carmain.local cms.carmain.localhost.com;

  include /etc/nginx/snippets/ssl-dev.conf;

  client_max_body_size 16m;

  location / {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cms_upstream cms:8000;
    proxy_pass http://$cms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  server_name rabbitmq.carmain.local rabbitmq.carmain.localhost.com;

  include /etc/nginx/snippets/ssl-dev.conf;

  location / {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rabbitmq_upstream rabbitmq:15672;
    proxy_pass http://$rabbitmq_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
