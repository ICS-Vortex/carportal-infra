services:
  frontend:
    container_name: car-portal-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      INTERNAL_API_BASE_URL: http://backend:4000
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://api.carmain.local}
      NEXT_PUBLIC_WEBSITE_URL: ${APP_BASE_URL:-https://carmain.localhost.com}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    restart: unless-stopped

  backend:
    container_name: car-portal-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://car_portal:car_portal@postgres:5432/car_cms}
      FRONTEND_ORIGIN: ${APP_BASE_URL:-http://carmain.local}
      API_ORIGIN: ${API_BASE_URL:-http://api.carmain.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://carmain.local}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOADS_DIR: /app/uploads
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-notify@carmain.local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      CMS_UPLOAD_SECRET: ${CMS_UPLOAD_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - vehicle-uploads:/app/uploads
    restart: unless-stopped

  worker:
    container_name: car-portal-worker
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npm install && npm run worker:dev"
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://car_portal:car_portal@postgres:5432/car_cms}
      FRONTEND_ORIGIN: ${APP_BASE_URL:-http://carmain.local}
      API_ORIGIN: ${API_BASE_URL:-http://api.carmain.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://carmain.local}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-notify@carmain.local}
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    restart: unless-stopped

  cms:
    container_name: car-portal-cms
    image: car-portal-cms:dev
    build:
      context: ./cms
      dockerfile: docker/Dockerfile
      target: dev
    user: "${CMS_UID:-1000}:${CMS_GID:-1000}"
    command: cms-web-entrypoint
    environment:
      APP_ENV: dev
      APP_SECRET: ${CMS_APP_SECRET:-carmain-cms-dev-secret}
      DATABASE_URL: postgresql://${POSTGRES_USER:-car_portal}:${POSTGRES_PASSWORD:-car_portal}@postgres:5432/car_cms?serverVersion=17&charset=utf8
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-car_portal}:${RABBITMQ_PASSWORD:-car_portal}@rabbitmq:5672/%2f/messages
      DEFAULT_URI: ${CMS_BASE_URL:-https://cms.carmain.localhost.com}
      CMS_ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:-editor@carmain.localhost.com}
      CMS_ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:-carmain-admin-dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Set to 1 on first clone or after composer.json changes (slows every cms restart).
      CMS_COMPOSER_INSTALL: ${CMS_COMPOSER_INSTALL:-0}
      PORTAL_API_INTERNAL_URL: ${PORTAL_API_INTERNAL_URL:-http://backend:4000}
      CMS_UPLOAD_SECRET: ${CMS_UPLOAD_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/health') === false ? 1 : 0);\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 45s
    volumes:
      - ./cms:/app
    restart: unless-stopped

  cms-worker:
    container_name: car-portal-cms-worker
    image: car-portal-cms:dev
    build:
      context: ./cms
      dockerfile: docker/Dockerfile
      target: dev
    user: "${CMS_UID:-1000}:${CMS_GID:-1000}"
    command: cms-worker-entrypoint
    environment:
      APP_ENV: dev
      APP_SECRET: ${CMS_APP_SECRET:-carmain-cms-dev-secret}
      DATABASE_URL: postgresql://${POSTGRES_USER:-car_portal}:${POSTGRES_PASSWORD:-car_portal}@postgres:5432/car_cms?serverVersion=17&charset=utf8
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-car_portal}:${RABBITMQ_PASSWORD:-car_portal}@rabbitmq:5672/%2f/messages
      DEFAULT_URI: ${CMS_BASE_URL:-https://cms.carmain.localhost.com}
      CMS_ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:-editor@carmain.localhost.com}
      CMS_ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:-carmain-admin-dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CMS_COMPOSER_INSTALL: "1"
      PORTAL_API_INTERNAL_URL: ${PORTAL_API_INTERNAL_URL:-http://backend:4000}
      CMS_UPLOAD_SECRET: ${CMS_UPLOAD_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      cms:
        condition: service_started
    volumes:
      - ./cms:/app
    restart: unless-stopped

  postgres:
    container_name: car-portal-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-car_portal}
      POSTGRES_USER: ${POSTGRES_USER:-car_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-car_portal}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-car_portal} -d ${POSTGRES_DB:-car_portal}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres17-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  pgadmin:
    container_name: car-portal-pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@carmain.localhost.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/misc/ping', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped

  rabbitmq:
    container_name: car-portal-rabbitmq
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-car_portal}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-car_portal}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    container_name: car-portal-redis
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nginx:
    container_name: car-portal-nginx
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      pgadmin:
        condition: service_healthy
      cms:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/public:/var/www/frontend-public:ro
    restart: unless-stopped

volumes:
  frontend-node-modules:
  backend-node-modules:
  postgres17-data:
  pgadmin-data:
  vehicle-uploads:
  redis-data:
