services:
  frontend:
    container_name: car-portal-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      INTERNAL_API_BASE_URL: http://backend:4000
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://api.carmain.local}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    restart: unless-stopped

  backend:
    container_name: car-portal-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npm install && npm run db:migrate && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://car_portal:car_portal@postgres:5432/car_portal}
      FRONTEND_ORIGIN: ${APP_BASE_URL:-http://carmain.local}
      API_ORIGIN: ${API_BASE_URL:-http://api.carmain.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://carmain.local}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOADS_DIR: /app/uploads
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-notify@carmain.local}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - vehicle-uploads:/app/uploads
    restart: unless-stopped

  worker:
    container_name: car-portal-worker
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npm install && npm run db:migrate && npm run worker:dev"
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://car_portal:car_portal@postgres:5432/car_portal}
      FRONTEND_ORIGIN: ${APP_BASE_URL:-http://carmain.local}
      API_ORIGIN: ${API_BASE_URL:-http://api.carmain.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://carmain.local}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-notify@carmain.local}
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    restart: unless-stopped

  postgres:
    container_name: car-portal-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-car_portal}
      POSTGRES_USER: ${POSTGRES_USER:-car_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-car_portal}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-car_portal} -d ${POSTGRES_DB:-car_portal}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres17-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  pgadmin:
    container_name: car-portal-pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@carmain.localhost.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/misc/ping', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped

  nginx:
    container_name: car-portal-nginx
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      pgadmin:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  frontend-node-modules:
  backend-node-modules:
  postgres17-data:
  pgadmin-data:
  vehicle-uploads:
